<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../fonts/materialdesignicons.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .mdi:before { font-family: "Material Design Icons" !important; }
  body { background: #F0EFF5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

  /* ── Shared card base ── */
  .hcard {
    position: relative;
    border-radius: 10px;
    padding: 24px 28px;
    color: #fff;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
  }
  .hcard .flow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .hcard .content { position: relative; z-index: 1; }

  .hcard h3 { font-size: clamp(16px, 2.5vw, 20px); font-weight: 600; letter-spacing: -0.01em; }
  .hcard .sub { font-size: 13px; opacity: .6; margin-top: 4px; }

  .hcard .row {
    display: flex;
    flex-wrap: wrap;
    gap: 20px 28px;
    margin-top: 20px;
  }
  .hcard .item { display: flex; align-items: center; gap: 11px; }
  .hcard .box {
    width: 36px; height: 36px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hcard i { font-size: 17px; color: #fff; }
  .hcard .lbl { font-size: 10px; opacity: .7; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
  .hcard .val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ── Variant A: Deep Violet + Holographic Shimmer ── */
  .card-a {
    background: linear-gradient(140deg, #3d2fa0 0%, #4840C8 30%, #2E2880 65%, #1C1752 100%);
    box-shadow:
      0 2px 0 rgba(158,149,245,.25) inset,
      0 -1px 0 rgba(0,0,0,.3) inset,
      0 8px 36px rgba(20,16,80,.5);
  }
  .card-a::before {
    content: "";
    position: absolute; top: 0; left: 10%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(158,149,245,.8), rgba(255,255,255,.5), rgba(158,149,245,.4), transparent);
    z-index: 0; pointer-events: none;
  }
  .card-a::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 20% 50%, rgba(115,103,240,.18) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 30%, rgba(158,149,245,.12) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .card-a .box {
    background: rgba(158,149,245,.15);
    border: 1px solid rgba(158,149,245,.30);
    box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.12) inset;
  }
  .card-a i { color: #fff; }

  /* ── Variant B: deep dark, lighter ribbon ── */
  .card-b {
    background: linear-gradient(130deg, #2E2880 0%, #251F6B 60%, #1C1752 100%);
    box-shadow: 0 4px 20px rgba(20,16,60,.30);
  }
  .card-b .box { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.06); }

  /* ── Variant C: split layout ── */
  .card-c {
    background: linear-gradient(130deg, #7367F0 0%, #5A4FE3 50%, #4A3FCF 100%);
    box-shadow: 0 4px 20px rgba(74,63,207,.22);
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0;
  }
  .card-c .left {
    flex: 1 1 0;
    padding: 24px 28px;
    border-right: 1px solid rgba(255,255,255,.08);
  }
  .card-c .right {
    display: flex;
    align-items: center;
    padding: 24px 28px;
    gap: 28px;
    flex-wrap: wrap;
  }
  .card-c .box { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.07); }
  .card-c .content { position: relative; z-index: 1; }

  @media (max-width: 520px) {
    .card-c { flex-direction: column; }
    .card-c .left { border-right: none; border-bottom: 1px solid rgba(255,255,255,.08); width: 100%; }
    .card-c .right { padding-top: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ── Reusable 3D ribbon SVG — barely-there ── */
function Ribbon({ flip = false, opacity = 1, gradId = "rib" }) {
  const t = `${flip ? "scale(-1,1) translate(-800,0)" : ""}`;
  return (
    <svg className="flow" viewBox="0 0 800 200" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id={`fade-${gradId}`} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stopColor="white" stopOpacity="0"/>
          <stop offset="8%"   stopColor="white" stopOpacity="1"/>
          <stop offset="92%"  stopColor="white" stopOpacity="1"/>
          <stop offset="100%" stopColor="white" stopOpacity="0"/>
        </linearGradient>
        <mask id={`m-${gradId}`}>
          <rect width="800" height="200" fill={`url(#fade-${gradId})`}/>
        </mask>
      </defs>
      <g mask={`url(#m-${gradId})`} transform={t} style={{opacity}}>
        {/* shadow band */}
        <path fill="rgba(0,0,0,0.06)"
              d="M -40,150 C 120,150 180,68 310,68 S 500,160 610,110 760,48 900,78
                 L 900,86 C 760,56 610,118 500,169 S 310,80 180,76 C 50,72 -40,160 -40,160 Z"/>
        {/* mid fill */}
        <path fill="rgba(255,255,255,0.04)"
              d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66
                 L 900,86 C 760,56 610,118 500,169 S 310,80 180,76 C 50,72 -40,160 -40,160 Z"/>
        {/* top highlight */}
        <path fill="rgba(255,255,255,0.09)"
              d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66
                 L 900,70 C 760,40 610,102 500,152 S 310,70 180,66 C 50,62 -40,142 -40,142 Z"/>
        {/* top hairline */}
        <path fill="none" stroke="rgba(255,255,255,0.10)" strokeWidth="0.8"
              d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66"/>
        {/* bottom hairline */}
        <path fill="none" stroke="rgba(0,0,0,0.05)" strokeWidth="0.8"
              d="M -40,160 C 120,160 180,78 310,78 S 500,168 610,118 760,58 900,88"/>
      </g>
    </svg>
  );
}

/* ── Variant A — gradient card, split layout ── */
function CardA() {
  return (
    <div className="hcard card-a" style={{display:"flex",alignItems:"center",gap:0,padding:0}}>
      <Ribbon flip={true} opacity={0.85} gradId="a"/>
      <div className="content" style={{flex:"1 1 0",padding:"24px 28px",borderRight:"1px solid rgba(255,255,255,.08)"}}>
        <h3>Welcome back, Soren Vinson</h3>
        <div className="sub">Here's what's happening with your properties today.</div>
      </div>
      <div className="content" style={{display:"flex",alignItems:"center",padding:"24px 28px",gap:28,flexWrap:"wrap"}}>
        <div className="item">
          <div className="box"><i className="mdi mdi-home-outline"></i></div>
          <div><div className="lbl">Properties</div><div className="val">14</div></div>
        </div>
        <div className="item">
          <div className="box"><i className="mdi mdi-calendar"></i></div>
          <div><div className="lbl">Bookings</div><div className="val">6</div></div>
        </div>
        <div className="item">
          <div className="box"><i className="mdi mdi-swap-horizontal"></i></div>
          <div><div className="lbl">Turns</div><div className="val">1</div></div>
        </div>
      </div>
    </div>
  );
}

/* ── Variant B — deep dark card, ribbon lower ── */
function CardB() {
  return (
    <div className="hcard card-b">
      <Ribbon flip={false} opacity={0.6} gradId="b"/>
      <div className="content">
        <h3>Welcome back, Soren Vinson</h3>
        <div className="sub">Here's what's happening with your properties today.</div>
        <div className="row">
          <div className="item">
            <div className="box"><i className="mdi mdi-home-outline"></i></div>
            <div><div className="lbl">Properties</div><div className="val">14</div></div>
          </div>
          <div className="item">
            <div className="box"><i className="mdi mdi-calendar"></i></div>
            <div><div className="lbl">Bookings</div><div className="val">6</div></div>
          </div>
          <div className="item">
            <div className="box"><i className="mdi mdi-swap-horizontal"></i></div>
            <div><div className="lbl">Turns</div><div className="val">1</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Variant C — split layout, ribbon behind divider ── */
function CardC() {
  return (
    <div className="hcard card-c">
      <Ribbon flip={true} opacity={0.5} gradId="c"/>
      <div className="left content">
        <h3>Welcome back, Soren Vinson</h3>
        <div className="sub">Here's what's happening with your properties today.</div>
      </div>
      <div className="right content">
        <div className="item">
          <div className="box"><i className="mdi mdi-home-outline"></i></div>
          <div><div className="lbl">Properties</div><div className="val">14</div></div>
        </div>
        <div className="item">
          <div className="box"><i className="mdi mdi-calendar"></i></div>
          <div><div className="lbl">Bookings</div><div className="val">6</div></div>
        </div>
        <div className="item">
          <div className="box"><i className="mdi mdi-swap-horizontal"></i></div>
          <div><div className="lbl">Turns</div><div className="val">1</div></div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="Hero Card Variants">
      <DCSection id="variants" title="Hero Card">
        <DCArtboard id="a" label="A — Gradient" width={600} height={160}>
          <CardA/>
        </DCArtboard>
        <DCArtboard id="b" label="B — Deep Dark" width={600} height={160}>
          <CardB/>
        </DCArtboard>
        <DCArtboard id="c" label="C — Split Layout" width={600} height={120}>
          <CardC/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
