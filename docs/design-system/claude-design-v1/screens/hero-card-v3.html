<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../fonts/materialdesignicons.css">
<style>
  @font-face {
    font-family: "Material Design Icons";
    src: url('../fonts/materialdesignicons.woff2') format('woff2');
    font-weight: normal; font-style: normal;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .mdi:before { font-family: "Material Design Icons" !important; }
  body { background: #F0EFF5; font-family: var(--claro-font-family, -apple-system, sans-serif); }

  /* ── Shared card base (split layout from A) ── */
  .hcard {
    position: relative;
    border-radius: 12px;
    color: #fff;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
    display: flex;
    align-items: stretch;
  }

  /* Decorative full-bleed SVG layer */
  .hcard .flow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* Left: text pane */
  .hcard .left {
    flex: 1 1 0;
    padding: 24px 28px;
    border-right: 1px solid rgba(255,255,255,.10);
    position: relative; z-index: 1;
  }
  .hcard h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .hcard .sub { font-size: 12.5px; opacity: .75; margin-top: 5px; line-height: 1.4; }

  /* Right: stats pane */
  .hcard .right {
    display: flex;
    align-items: center;
    padding: 24px 28px;
    gap: 28px;
    flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .hcard .item { display: flex; align-items: center; gap: 11px; }
  .hcard .box {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hcard i { font-size: 18px; color: #fff; }
  .hcard .lbl { font-size: 10px; opacity: .75; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .hcard .val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ══ VARIANT 1 — Aurora: primary-light → primary → primary-dark ══ */
  .card-1 {
    background: linear-gradient(125deg, #9E95F5 0%, #7367F0 40%, #5A4FE3 75%, #4840C8 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.18) inset,
      0 -1px 0 rgba(0,0,0,.12) inset,
      0 8px 32px rgba(74,63,207,.35),
      0 1px 0 rgba(158,149,245,.4);
  }
  /* Top glass sheen */
  .card-1::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 100%);
    border-radius: 12px 12px 0 0;
    pointer-events: none; z-index: 2;
  }
  .card-1 .box {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 2px 6px rgba(0,0,0,.15), 0 1px 0 rgba(255,255,255,.2) inset;
  }

  /* ══ VARIANT 2 — Deep Violet: layered dark primary with holographic shimmer ══ */
  .card-2 {
    background: linear-gradient(140deg, #3d2fa0 0%, #4840C8 30%, #2E2880 65%, #1C1752 100%);
    box-shadow:
      0 2px 0 rgba(158,149,245,.25) inset,
      0 -1px 0 rgba(0,0,0,.3) inset,
      0 8px 36px rgba(20,16,80,.5);
  }
  /* Holographic shimmer streak */
  .card-2::before {
    content: "";
    position: absolute; top: 0; left: 10%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(158,149,245,.8), rgba(255,255,255,.5), rgba(158,149,245,.4), transparent);
    z-index: 0; pointer-events: none;
  }
  /* Subtle noise texture via radial glows */
  .card-2::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 80% at 20% 50%, rgba(115,103,240,.18) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 30%, rgba(158,149,245,.12) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .card-2 .box {
    background: rgba(158,149,245,.15);
    border: 1px solid rgba(158,149,245,.30);
    box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.12) inset;
  }
  .card-2 i { color: #fff; }
  .card-2 .val { color: #fff; }

  /* ══ VARIANT 3 — Prism: primary-dark → primary → primary-light (diagonal with orbs) ══ */
  .card-3 {
    background: linear-gradient(110deg, #4840C8 0%, #5A4FE3 30%, #7367F0 60%, #9E95F5 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.20) inset,
      0 -1px 0 rgba(0,0,0,.10) inset,
      0 10px 40px rgba(90,79,227,.40);
  }
  /* Orb glow top-left */
  .card-3::before {
    content: "";
    position: absolute; top: -30px; left: -20px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none; z-index: 2;
  }
  /* Orb glow bottom-right */
  .card-3::after {
    content: "";
    position: absolute; bottom: -40px; right: -10px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(72,64,200,.35) 0%, rgba(72,64,200,0) 70%);
    pointer-events: none; z-index: 0;
  }
  .card-3 .box {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.30);
    box-shadow: 0 3px 10px rgba(72,64,200,.30), 0 1px 0 rgba(255,255,255,.25) inset;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── Ribbon wave (from original A) ── */
function Ribbon({ flip = false, opacity = 1, gradId = "rib" }) {
  const t = flip ? "scale(-1,1) translate(-800,0)" : "";
  return (
    <svg className="flow" viewBox="0 0 800 200" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id={`fade-${gradId}`} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stopColor="white" stopOpacity="0"/>
          <stop offset="8%"   stopColor="white" stopOpacity="1"/>
          <stop offset="92%"  stopColor="white" stopOpacity="1"/>
          <stop offset="100%" stopColor="white" stopOpacity="0"/>
        </linearGradient>
        <mask id={`m-${gradId}`}>
          <rect width="800" height="200" fill={`url(#fade-${gradId})`}/>
        </mask>
      </defs>
      <g mask={`url(#m-${gradId})`} transform={t} style={{opacity}}>
        <path fill="rgba(0,0,0,0.05)" d="M -40,150 C 120,150 180,68 310,68 S 500,160 610,110 760,48 900,78 L 900,86 C 760,56 610,118 500,169 S 310,80 180,76 C 50,72 -40,160 -40,160 Z"/>
        <path fill="rgba(255,255,255,0.05)" d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66 L 900,86 C 760,56 610,118 500,169 S 310,80 180,76 C 50,72 -40,160 -40,160 Z"/>
        <path fill="rgba(255,255,255,0.11)" d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66 L 900,70 C 760,40 610,102 500,152 S 310,70 180,66 C 50,62 -40,142 -40,142 Z"/>
        <path fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="0.8" d="M -40,138 C 120,138 180,56 310,56 S 500,146 610,96 760,36 900,66"/>
      </g>
    </svg>
  );
}

/* ── Stat item ── */
function Stat({ icon, label, value, cls }) {
  return (
    <div className="item">
      <div className={`box ${cls}`}><i className={`mdi ${icon}`}></i></div>
      <div>
        <div className="lbl">{label}</div>
        <div className="val">{value}</div>
      </div>
    </div>
  );
}

/* ── Shared split card structure ── */
function HeroCard({ cls, ribbonGradId, ribbonOpacity = 0.85 }) {
  return (
    <div className={`hcard ${cls}`}>
      <Ribbon flip={true} opacity={ribbonOpacity} gradId={ribbonGradId}/>
      <div className="left">
        <h3>Welcome back, Soren Vinson</h3>
        <div className="sub">Here's what's happening with your properties today.</div>
      </div>
      <div className="right">
        <Stat icon="mdi-home-outline"    label="Properties" value="14" cls={cls}/>
        <Stat icon="mdi-calendar"        label="Bookings"   value="6"  cls={cls}/>
        <Stat icon="mdi-swap-horizontal" label="Turns"      value="1"  cls={cls}/>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="Hero Card — Gradient 3D Variants (base: A)">
      <DCSection id="variants" title="Gradient + 3D Variants">
        <DCArtboard id="v1" label="1 — Aurora (Light → Primary → Dark)" width={620} height={130}>
          <HeroCard cls="card-1" ribbonGradId="r1" ribbonOpacity={0.7}/>
        </DCArtboard>
        <DCArtboard id="v2" label="2 — Deep Violet + Holographic Shimmer" width={620} height={130}>
          <HeroCard cls="card-2" ribbonGradId="r2" ribbonOpacity={0.5}/>
        </DCArtboard>
        <DCArtboard id="v3" label="3 — Prism (Dark → Light diagonal + orb glows)" width={620} height={130}>
          <HeroCard cls="card-3" ribbonGradId="r3" ribbonOpacity={0.65}/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
