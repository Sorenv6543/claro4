<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body {
    margin: 0; padding: 18px; background: #fff;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    padding: 4px 12px; border-radius: 9999px;
    font-family: inherit;
    font-size: 11px; font-weight: 500; letter-spacing: 0;
    line-height: 1.4;
  }
  .label {
    font-family: inherit;
    font-size: 10px; color: var(--claro-fg3);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 4px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="label">Status (tonal)</div>
  <div class="row">
    <span class="pill" style="background:rgba(40,199,111,.16);color:#1fa85d">Active</span>
    <span class="pill" style="background:rgba(234,84,85,.16);color:#c44647">Inactive</span>
    <span class="pill" style="background:rgba(255,159,67,.16);color:#cc7a2e">Pending</span>
    <span class="pill" style="background:rgba(0,207,232,.16);color:#00a7ba">In Progress</span>
    <span class="pill" style="background:rgba(40,199,111,.16);color:#1fa85d">Completed</span>
  </div>
  <div class="label">Booking type</div>
  <div class="row">
    <span class="pill" style="background:transparent;border:1px solid #FF9F43;color:#cc7a2e">Turn</span>
    <span class="pill" style="background:transparent;border:1px solid #7367F0;color:#5E52EE">Standard</span>
    <span class="pill" style="background:rgba(255,159,67,.14);color:#cc7a2e">High</span>
  </div>
  <div class="label">Tier</div>
  <div class="row">
    <span class="pill" style="background:transparent;border:1px solid #7367F0;color:#5E52EE">Basic</span>
    <span class="pill" style="background:transparent;border:1px solid #00CFE8;color:#00a7ba">Standard</span>
    <span class="pill" style="background:transparent;border:1px solid #EA5455;color:#c44647">Premium</span>
  </div>
  <div class="label">Role</div>
  <div class="row">
    <span class="pill" style="background:rgba(234,84,85,.16);color:#c44647">Admin</span>
    <span class="pill" style="background:rgba(115,103,240,.16);color:#5E52EE">Owner</span>
    <span class="pill" style="background:rgba(40,199,111,.16);color:#1fa85d">Cleaner</span>
  </div>
</body>
</html>
