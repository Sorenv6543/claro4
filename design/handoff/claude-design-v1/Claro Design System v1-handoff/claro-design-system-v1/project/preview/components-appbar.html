<style>
  :root {
    --claro-primary:      #7367F0;
    --claro-primary-dark: #5E52EE;
    --claro-primary-tint: #F0EEFF;
    --claro-surface:      #FFFFFF;
    --claro-background:   #F5F5F9;
    --claro-divider:      rgba(46,38,61,.12);
    --claro-fg1:          #2E263D;
    --claro-fg2:          rgba(46,38,61,.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--claro-background); font-family: 'Inter', system-ui, sans-serif; padding: 24px; }
  .mdi:before { font-family: 'Material Design Icons' !important; }

  .bar {
    background: #fff;
    height: 64px;
    border-bottom: 1px solid var(--claro-divider);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 1px 3px rgba(46,38,61,.06);
  }
  .wm { display: block; height: 38px; width: auto; flex-shrink: 0; }
  .toggle {
    width: 36px; height: 36px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; border: none;
    background: transparent; color: var(--claro-primary);
    transition: background 140ms ease;
  }
  .toggle:hover { background: var(--claro-primary-tint); }
  .tiles { display: grid; grid-template-columns: repeat(2,8px); grid-template-rows: repeat(2,8px); gap: 3px; }
  .tiles span { border-radius: 1.5px; background: var(--claro-primary); }
  .tiles span:nth-child(2), .tiles span:nth-child(3) { opacity: .45; }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 2px; align-items: center; }
  .btn {
    width: 38px; height: 38px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; background: transparent;
    color: var(--claro-fg2); transition: background 140ms ease;
  }
  .btn:hover { background: rgba(46,38,61,.05); color: var(--claro-fg1); }
  .btn i { font-size: 20px; }
  .chevron-btn {
    display: flex; align-items: center;
    padding: 0 6px 0 4px; height: 38px; border-radius: 6px;
    cursor: pointer; border: none; background: transparent;
    color: var(--claro-fg2); transition: background 140ms ease;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .chevron-btn:hover { background: rgba(46,38,61,.05); color: var(--claro-fg1); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--claro-primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; margin-left: 4px; position: relative;
  }
  .status-dot {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #28C76F; bottom: 0; right: 0; border: 2px solid #fff;
  }
</style>
</head>

  <div class="bar">
    <svg class="wm" viewBox="0 -24 420 180" fill="none" aria-label="Claro">
      <defs>
        <linearGradient id="wm-arc" x1="338" y1="88" x2="140" y2="56" gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#5A4FE3" stop-opacity="0"/>
          <stop offset="65%"  stop-color="#5A4FE3" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#5A4FE3" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <text x="8" y="118" font-family="'Inter',system-ui,sans-serif" font-weight="700" font-size="128" letter-spacing="-3.2" fill="#5A4FE3">Claro</text>
      <path d="M 338 88 Q 358 40 326 14 Q 288 -8 232 6 Q 168 20 140 56" stroke="url(#wm-arc)" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <button class="toggle" aria-label="Toggle sidebar">
      <div class="tiles"><span></span><span></span><span></span><span></span></div>
    </button>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn" aria-label="Favourites"><i class="mdi mdi-star-outline"></i></button>
      <button class="btn" aria-label="Notifications"><i class="mdi mdi-bell-outline"></i></button>
      <button class="chevron-btn" aria-label="More options"><i class="mdi mdi-chevron-down" style="font-size:22px;"></i></button>
      <div class="avatar">SV<div class="status-dot"></div></div>
    </div>
  </div>
</body>
