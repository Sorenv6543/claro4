<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile Timeline · Claro</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--claro-font-family); }
  #root { width: 100vw; height: 100vh; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail" data-bg-color="#5A4FE3">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- phone outline -->
    <rect x="30" y="18" width="40" height="64" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- stacked timeline bars -->
    <rect x="36" y="30" width="28" height="6" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="36" y="40" width="28" height="6" rx="1" fill="#fff" opacity="0.6"/>
    <rect x="36" y="50" width="28" height="6" rx="1" fill="#fff" opacity="0.4"/>
    <rect x="36" y="60" width="28" height="6" rx="1" fill="#fff" opacity="0.25"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens-mobile-timeline.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        title="Mobile timeline — multi-house feed"
        subtitle="Vertical day-grouped feed, top house-chip rail for filtering. Tap any card to expand.">
        <DCArtboard label="A · All houses · 7-day window" width={402} height={874}>
          <IOSDevice width={402} height={874}>
            <TimelineScreen initialSelected="all" initialExpanded="e2" initialRange={7} />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard label="B · Filtered to one house" width={402} height={874}>
          <IOSDevice width={402} height={874}>
            <TimelineScreen initialSelected="p1" initialExpanded={null} initialRange={14} />
          </IOSDevice>
        </DCArtboard>
        <DCArtboard label="C · Collapsed · 3d window" width={402} height={874}>
          <IOSDevice width={402} height={874}>
            <TimelineScreen initialSelected="all" initialExpanded={null} initialRange={3} />
          </IOSDevice>
        </DCArtboard>
        <DCPostIt top={-10} left={-160} rotate={-3} width={180}>
          Turns get a split red→green bar + an inline cleaning-window strip when expanded.
        </DCPostIt>
        <DCPostIt top={200} right={-180} rotate={2} width={190}>
          Every card is double-tinted: event color on the outer 4px, house color on the inner 3px.
        </DCPostIt>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
