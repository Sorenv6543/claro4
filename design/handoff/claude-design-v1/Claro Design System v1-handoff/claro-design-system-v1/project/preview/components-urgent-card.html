<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root {
    --display: 'Inter', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --amber: #FDD835;
    --amber-dark: #B59300;
    --amber-soft: #FFF8DC;
    --ink: #2E263D;
    --ink-2: #57506A;
    --ink-3: #8B8499;
  }
  body {
    margin: 0; padding: 28px;
    background: var(--claro-background);
    font-family: var(--body);
    color: var(--ink);
    font-feature-settings: 'tnum' 1;
  }

  .card {
    position: relative;
    max-width: 480px;
    background: #fff;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 1px 2px rgba(46,38,61,.06),
      0 8px 24px -8px rgba(46,38,61,.18),
      0 2px 6px rgba(46,38,61,.04);
  }

  .top {
    position: relative;
    background:
      radial-gradient(110% 140% at 10% 0%, rgba(255,106,61,.22) 0%, rgba(255,159,67,.08) 35%, rgba(255,248,220,0) 70%),
      linear-gradient(180deg, #FFF0D6 0%, #FFE8C4 60%, var(--amber-soft) 100%);
    padding: 18px 20px 22px;
    border-bottom: 1px solid rgba(181,147,0,.20);
    overflow: hidden;
  }

  /* Ignition edge — the orange-to-amber light strip */
  .top::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, #FF6A3D 0%, #E8891A 55%, var(--amber-dark) 100%);
    box-shadow: 0 0 12px rgba(255,106,61,.45);
    z-index: 2;
  }

  /* ─── Lightning watermark ──────────────────────────────
     A big bolt sweeping behind the top zone — establishes the
     "urgent" metaphor as a visual, not just a word. Very low
     contrast so copy remains legible. */
  .bolt-bg {
    position: absolute;
    right: -18px;
    top: -20px;
    width: 180px;
    height: 180px;
    pointer-events: none;
    opacity: 0.45;
    z-index: 0;
  }
  .bolt-bg path {
    fill: url(#boltFill);
    filter: drop-shadow(0 4px 10px rgba(255,106,61,0.25));
  }

  /* Shimmer across the bolt every few seconds */
  .bolt-shimmer {
    position: absolute;
    inset: 0;
    mix-blend-mode: overlay;
    opacity: 0;
    animation: bolt-flash 5s ease-out infinite;
    pointer-events: none;
  }
  @keyframes bolt-flash {
    0%, 94%, 100% { opacity: 0; }
    96% { opacity: 0.6; }
    97% { opacity: 0.1; }
    98% { opacity: 0.5; }
  }

  .top-content {
    position: relative;
    z-index: 1;
  }

  /* Countdown pill — top right of the hero zone */
  .countdown {
    position: absolute; top: 0; right: 0;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 9px;
    border-radius: 9999px;
    background: rgba(255,255,255,.70);
    border: 1px solid rgba(107,85,0,.14);
    backdrop-filter: blur(6px);
    font-family: var(--display);
    font-size: 11px; font-weight: 600;
    color: #6B5500;
    letter-spacing: -0.005em;
    line-height: 1;
    z-index: 2;
  }
  .countdown .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber-dark);
    box-shadow: 0 0 0 0 rgba(181,147,0,.55);
    animation: cd-pulse 2s ease-out infinite;
  }
  .countdown .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  .countdown .lbl { color: rgba(107,85,0,.65); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; font-size: 9.5px; }
  @keyframes cd-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(181,147,0,.55); }
    70%  { box-shadow: 0 0 0 6px rgba(181,147,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(181,147,0,0); }
  }

  /* Kicker row — lightning glyph leads */
  .kicker {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--body);
    font-size: 11px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: #A34A00;
    margin-bottom: 10px;
    margin-top: 2px;
  }
  .kicker .bolt-ico {
    width: 14px; height: 14px;
    color: #FF6A3D;
    filter: drop-shadow(0 1px 2px rgba(255,106,61,0.35));
  }
  .kicker .count {
    margin-left: auto;
    background: var(--amber-dark); color: #fff;
    font-size: 10px; font-weight: 600;
    padding: 2px 9px; border-radius: 9999px;
    letter-spacing: .05em;
  }

  .headline {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: var(--ink);
    margin: 0 0 6px;
    max-width: 85%;
  }
  .sub {
    font-family: var(--body);
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.4;
  }

  /* Bottom (white) zone */
  .bottom {
    padding: 18px 20px 16px;
    background: #fff;
  }

  .label-row {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--body);
    font-size: 10px; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 16px;
  }
  .label-row .gap {
    font-family: var(--display);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0; text-transform: none;
    color: #6B5500;
    background: rgba(253,216,53,.18);
    border: 1px solid rgba(181,147,0,.25);
    padding: 2px 8px; border-radius: 9999px;
  }
  .label-row .gap strong { font-weight: 700; }

  /* Timeline */
  .rail {
    position: relative;
    height: 38px;
    margin: 0 4px 8px;
  }
  .rail .track {
    position: absolute; left: 0; right: 0; top: 16px; height: 3px;
    background: #E8E8E8;
    border-radius: 2px;
  }
  .rail .fill {
    position: absolute; left: 22%; right: 40%; top: 16px; height: 3px;
    background: linear-gradient(90deg, var(--amber) 0%, #F5C518 100%);
    border-radius: 2px;
    box-shadow: 0 0 0 2px rgba(253,216,53,.18);
  }
  .rail .tick {
    position: absolute; top: 10px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--claro-primary);
    transform: translateX(-50%);
    box-shadow: 0 1px 2px rgba(46,38,61,.12);
  }
  .rail .tick.in { background: var(--claro-primary); border-color: var(--claro-primary); box-shadow: 0 0 0 4px rgba(115,103,240,.15), 0 1px 2px rgba(46,38,61,.18); }
  .rail .tick.out { left: 22%; }
  .rail .tick.in  { left: 60%; }
  .rail .time {
    position: absolute; top: 28px;
    transform: translateX(-50%);
    font-family: var(--display);
    font-size: 13px; font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .rail .tag {
    position: absolute; top: -16px;
    transform: translateX(-50%);
    font-family: var(--body);
    font-size: 9px; font-weight: 600;
    color: var(--ink-3);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .rail .out-pos { left: 22%; }
  .rail .in-pos  { left: 60%; }

  /* Footer */
  .foot {
    display: flex; gap: 10px;
    padding: 14px 20px 18px;
    background: #fff;
    border-top: 1px solid #F0F0F3;
    align-items: center;
  }
  .btn {
    font-family: var(--body);
    border: none; cursor: pointer;
    border-radius: 9999px;
    font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    flex: 1;
    position: relative;
    background: var(--claro-primary);
    color: #ffffff;
    padding: 10px 18px;
    letter-spacing: 0.005em;
    box-shadow: 0 1px 2px rgba(115,103,240,.35), 0 4px 10px -2px rgba(115,103,240,.4);
    overflow: hidden;
  }
  .btn-primary .bolt-ico { width: 14px; height: 14px; color: #FFD76A; }
  .btn-primary span { color: #ffffff; }

  /* Lightning trail sweeping across the CTA — subtle urgency signal in the BOTTOM RIGHT */
  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; left: -30%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255,215,106,0.35) 50%, transparent 100%);
    animation: cta-sweep 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cta-sweep {
    0%, 30% { transform: translateX(0); opacity: 0; }
    45% { opacity: 1; }
    70%, 100% { transform: translateX(350%); opacity: 0; }
  }

  .btn-secondary {
    background: transparent;
    color: var(--ink-2);
    padding: 10px 16px;
    border: 1px solid #E8E8E8;
  }
  .btn-icon {
    width: 38px; height: 38px;
    padding: 0;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #E8E8E8;
    color: var(--ink-2);
  }
  .btn-icon i { font-size: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .bolt-shimmer, .countdown .pulse, .btn-primary::after { animation: none; }
  }
</style>
</head>
<body>
  <!-- Shared SVG defs for the lightning bolt -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Classic lightning bolt shape — jagged, asymmetric, leans forward -->
      <symbol id="bolt" viewBox="0 0 24 24">
        <path d="M13.5 2 L4 13.5 L11 13.5 L9 22 L20 9 L13 9 Z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="0.5"
              stroke-linejoin="round"/>
      </symbol>
      <linearGradient id="boltFill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#FF6A3D"/>
        <stop offset="55%"  stop-color="#FF9F43"/>
        <stop offset="100%" stop-color="#FDD835"/>
      </linearGradient>
      <linearGradient id="boltShimmer" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="card">
    <div class="top">
      <!-- Big watermark bolt -->
      <svg class="bolt-bg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13.5 2 L4 13.5 L11 13.5 L9 22 L20 9 L13 9 Z"
              stroke="rgba(255,106,61,0.25)"
              stroke-width="0.3"
              stroke-linejoin="round"/>
        <!-- Shimmer overlay -->
        <path class="bolt-shimmer"
              d="M13.5 2 L4 13.5 L11 13.5 L9 22 L20 9 L13 9 Z"
              fill="url(#boltShimmer)"/>
      </svg>

      <div class="countdown" aria-label="Time until guest arrival">
        <span class="pulse"></span>
        <span class="num">3h 42m</span>
        <span class="lbl">to check-in</span>
      </div>

      <div class="top-content">
        <div class="kicker">
          <svg class="bolt-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13.5 2 L4 13.5 L11 13.5 L9 22 L20 9 L13 9 Z"/>
          </svg>
          Same-day turn
          <span class="count">1</span>
        </div>
        <h2 class="headline">1600 Pennsylvania Ave NW</h2>
        <div class="sub">2 bd · Standard clean · 120 min · No cleaner assigned</div>
      </div>
    </div>

    <div class="bottom">
      <div class="label-row">
        <span>Cleaning window · Today</span>
        <span class="gap"><strong>4h</strong> window</span>
      </div>
      <div class="rail">
        <div class="track"></div>
        <div class="fill"></div>

        <div class="tag out-pos">Guest out</div>
        <div class="tick out"></div>
        <div class="time out-pos">11:00</div>

        <div class="tag in-pos">Guest in</div>
        <div class="tick in"></div>
        <div class="time in-pos">3:00 PM</div>
      </div>
    </div>

    <div class="foot">
      <button class="btn btn-icon" title="More"><i class="mdi mdi-dots-horizontal"></i></button>
      <button class="btn btn-secondary">View Details</button>
      <button class="btn btn-primary">
        <svg class="bolt-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.5 2 L4 13.5 L11 13.5 L9 22 L20 9 L13 9 Z"/>
        </svg>
        <span>Assign Cleaner</span>
      </button>
    </div>
  </div>
</body>
</html>
