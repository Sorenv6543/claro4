<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,100..700,0..1,0&display=block">
<style>
  body {
    margin: 0;
    padding: 32px;
    background: var(--claro-background);
    font-family: var(--claro-font-family);
    display: flex;
    align-items: flex-start;
  }

  .nav {
    width: 224px;
    background: var(--claro-surface);
    border: 1px solid var(--claro-divider);
    border-radius: 6px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .section-label {
    font-size: 10px;
    color: var(--claro-fg4);
    text-transform: uppercase;
    letter-spacing: .09em;
    font-weight: 600;
    padding: 8px 12px 4px;
    margin-top: 4px;
  }
  .section-label:first-child { margin-top: 0; }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    flex-shrink: 0;
    font-size: 22px;
    /* Rest: hairline, outlined */
    font-variation-settings: 'FILL' 0, 'wght' 100, 'GRAD' 0, 'opsz' 24;
    transition: font-variation-settings 360ms cubic-bezier(0.2, 0, 0, 1);
  }

  .badge {
    margin-left: auto;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 9999px;
    background: rgba(46, 38, 61, 0.07);
    color: var(--claro-fg2);
    font-weight: 700;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    color: var(--claro-fg3);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
  }

  .item:hover {
    background: rgba(46, 38, 61, 0.04);
    color: var(--claro-fg2);
  }
  .item:hover .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
  }

  .item.active {
    background: rgba(46, 38, 61, 0.075);
    color: var(--claro-fg1);
    font-weight: 600;
  }
  .item.active .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="section-label">Main</div>
    <div class="item active">
      <span class="material-symbols-outlined">dashboard</span>Overview
    </div>
    <div class="item">
      <span class="material-symbols-outlined">calendar_month</span>Calendar
    </div>
    <div class="item">
      <span class="material-symbols-outlined">format_list_bulleted</span>Bookings
    </div>
    <div class="item">
      <span class="material-symbols-outlined">home</span>Properties
      <span class="badge">5</span>
    </div>
    <div class="item">
      <span class="material-symbols-outlined">monitoring</span>Charts
    </div>
    <div class="section-label">Account</div>
    <div class="item">
      <span class="material-symbols-outlined">account_circle</span>Profile
    </div>
    <div class="item">
      <span class="material-symbols-outlined">settings</span>Settings
    </div>
  </nav>

  <script>
    document.querySelectorAll('.item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
