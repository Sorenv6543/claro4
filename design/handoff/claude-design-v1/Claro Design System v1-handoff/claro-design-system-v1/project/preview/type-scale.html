<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body {
    margin: 0; padding: 18px; background: #fff;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .label { width: 72px; font-size: 10px; color: var(--claro-fg3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .sample { color: var(--claro-fg1); font-family: inherit; }
  .h1   { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .h2   { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .h3   { font-size: 18px; font-weight: 600; letter-spacing: -0.005em; }
  .body { font-size: 15px; font-weight: 400; }
  .sub  { font-size: 13px; color: var(--claro-fg3); font-weight: 400; }
</style>
</head>
<body>
  <div class="row"><div class="label">H1 / 32</div><div class="sample h1">My Properties</div></div>
  <div class="row"><div class="label">H2 / 22</div><div class="sample h2">Today's Schedule</div></div>
  <div class="row"><div class="label">H3 / 18</div><div class="sample h3">Property Info</div></div>
  <div class="row"><div class="label">Body / 15</div><div class="sample body">Manage your rental properties and settings</div></div>
  <div class="row"><div class="label">Caption / 13</div><div class="sample sub">When guests arrive · sans-serif · Inter</div></div>
</body>
</html>
