<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  body { margin: 0; padding: 18px; background: var(--claro-background); font-family: var(--claro-font-family); }
  .card { background: #fff; border-radius: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.05); padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat { display: flex; align-items: flex-start; gap: 12px; }
  .tile { width: 42px; height: 42px; border-radius: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  i { font-size: 22px; }
  .label { font-size: 13px; color: var(--claro-fg3); line-height: 1.2; }
  .num { font-size: 22px; font-weight: 600; color: var(--claro-fg1); line-height: 1; margin-top: 3px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <div class="stat"><div class="tile" style="background:rgba(115,103,240,.14)"><i class="mdi mdi-home-outline" style="color:#7367F0"></i></div><div><div class="num">14</div><div class="label">Properties</div></div></div>
    <div class="stat"><div class="tile" style="background:rgba(40,199,111,.16)"><i class="mdi mdi-check-circle-outline" style="color:#28C76F"></i></div><div><div class="num">8</div><div class="label">Active</div></div></div>
    <div class="stat"><div class="tile" style="background:rgba(0,207,232,.16)"><i class="mdi mdi-calendar" style="color:#00CFE8"></i></div><div><div class="num">6</div><div class="label">Bookings</div></div></div>
    <div class="stat"><div class="tile" style="background:rgba(255,159,67,.16)"><i class="mdi mdi-swap-horizontal" style="color:#FF9F43"></i></div><div><div class="num">0</div><div class="label">Turns</div></div></div>
  </div>
</body>
</html>
