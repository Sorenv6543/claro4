  <!-- ───── MAIN ───── -->

<!-- Floating "Add booking" — always accessible -->

  Add booking

<!-- Tweaks panel — toggled by host via postMessage protocol -->
<aside class="tweaks-panel" id="tweaks" aria-hidden="true">
  <div class="tweaks-head">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
    Tweaks
  </div>
  <div class="tweaks-body" id="tweaksBody"></div>
</aside>

<!-- Mock data + variants -->
<script src="js/data.js"></script>
<script src="js/variant-a-triage.js"></script>
<script src="js/variant-b-timeline.js"></script>
<script src="js/variant-c-property.js"></script>

<script>
(function () {
  // ─── Tweakable defaults ───────────────────────────────────────
  const DEFAULTS = /*EDITMODE-BEGIN*/{
    "variant": "a",
    "days": 14,
    "props": "all",
    "density": "cozy",
    "strip": true,
    "cleaner": false
  }/*EDITMODE-END*/;

  // Restore from localStorage (non-tweak user state — variant + density preview)
  const STORE_KEY = 'claro.ownerOverview.state';
  const stored = (() => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; }
  })();
  const state = Object.assign({}, DEFAULTS, stored);

  const content = document.getElementById('content');
  const variantBtns = document.querySelectorAll('.header-variant-switch button');
  const headerDate = document.getElementById('headerDate');

  // ─── Render pipeline ───────────────────────────────────────────
  function render () {
    document.documentElement.setAttribute('data-density', state.density);

    variantBtns.forEach((b) => b.classList.toggle('active', b.dataset.variant === state.variant));

    if (state.variant === 'a') window.renderVariantA(content, state);
    else if (state.variant === 'b') window.renderVariantB(content, state);
    else if (state.variant === 'c') window.renderVariantC(content, state);

    // Header date always visible
    headerDate.textContent = window.CLARO.fmtFullDay(window.CLARO.TODAY);

    // Persist
    localStorage.setItem(STORE_KEY, JSON.stringify(state));

    // Re-render tweaks panel (so active state stays in sync if host opens it)
    renderTweaks();
  }

  // Variant switcher
  variantBtns.forEach((b) => {
    b.addEventListener('click', () => {
      state.variant = b.dataset.variant;
      render();
    });
  });

  // Keyboard shortcut: 1/2/3 switches variants
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '1') { state.variant = 'a'; render(); }
    else if (e.key === '2') { state.variant = 'b'; render(); }
    else if (e.key === '3') { state.variant = 'c'; render(); }
  });

  // ─── Tweaks panel UI ───────────────────────────────────────────
  const tweaksBody = document.getElementById('tweaksBody');
  const tweaksPanel = document.getElementById('tweaks');

  const TWEAK_DEFS = [
    { key: 'variant', label: 'Layout', options: [['a','Triage'],['b','Timeline'],['c','Property']] },
    { key: 'density', label: 'Density', options: [['cozy','Cozy'],['compact','Compact']] },
    { key: 'days',    label: 'Time range (variants B, C)', options: [[7,'7d'],[14,'14d'],[21,'21d']] },
    { key: 'props',   label: 'Properties shown',      options: [['all','All'],[2,'2 only'],[1,'1 only']] },
    { key: 'strip',   label: "Show Today's event strip (A)", kind: 'switch' },
    { key: 'cleaner', label: 'Show cleaner assignments',     kind: 'switch' },
  ];

  function renderTweaks () {
    tweaksBody.innerHTML = TWEAK_DEFS.map((t) => {
      if (t.kind === 'switch') {
        const on = Boolean(state[t.key]);
        return `
          <div class="tweak-row">
            <div class="tweak-switch">
              <span class="tweak-label" style="text-transform:none; letter-spacing:0; font-size:13px; color:var(--claro-text);">${t.label}</span>
              <button class="switch ${on ? 'on' : ''}" data-switch="${t.key}" aria-pressed="${on}"></button>
            </div>
          </div>`;
      }
      return `
        <div class="tweak-row">
          <div class="tweak-label">${t.label}</div>
          <div class="tweak-options" data-group="${t.key}">
            ${t.options.map(([v, l]) => `<button data-val="${v}" class="${String(state[t.key]) === String(v) ? 'active' : ''}">${l}</button>`).join('')}
          </div>
        </div>`;
    }).join('');

    // Segmented controls
    tweaksBody.querySelectorAll('.tweak-options').forEach((group) => {
      const key = group.dataset.group;
      group.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          let v = btn.dataset.val;
          // Preserve numeric type for days and props(when numeric)
          if (key === 'days') v = Number(v);
          if (key === 'props' && v !== 'all') v = Number(v);
          state[key] = v;
          render();
          notifyHost(key, v);
        });
      });
    });
    // Switches
    tweaksBody.querySelectorAll('.switch').forEach((sw) => {
      sw.addEventListener('click', () => {
        const k = sw.dataset.switch;
        state[k] = !state[k];
        render();
        notifyHost(k, state[k]);
      });
    });
  }

  // ─── Tweaks host protocol ───────────────────────────────────────
  // Persist to disk via parent
  function notifyHost (key, val) {
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
    } catch (e) {}
  }

  // Listen for activate/deactivate FIRST, then announce availability
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || !d.type) return;
    if (d.type === '__activate_edit_mode') {
      tweaksPanel.classList.add('visible');
      tweaksPanel.setAttribute('aria-hidden', 'false');
    } else if (d.type === '__deactivate_edit_mode') {
      tweaksPanel.classList.remove('visible');
      tweaksPanel.setAttribute('aria-hidden', 'true');
    }
  });

  try {
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  } catch (e) {}

  // ─── Kick it off ────────────────────────────────────────────────
  render();
})();
</script>
</body>
