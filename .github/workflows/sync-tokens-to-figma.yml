name: Export tokens for Tokens Studio

# Runs when tokens.css changes on main, or manually.
# Exports tokens.css → tokens/*.json so a designer can open Tokens Studio
# in Figma and click "Pull from GitHub" to sync values into Figma Variables.
# No Figma API credentials needed — the plugin handles the Figma side.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/styles/tokens.css"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Export tokens to Tokens Studio format
        run: node scripts/export-tokens.mjs

      - name: Commit updated token files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens/
          git diff --cached --quiet && echo "No token changes to commit." || \
            git commit -m "chore(tokens): sync tokens/ from tokens.css [skip ci]" && git push
