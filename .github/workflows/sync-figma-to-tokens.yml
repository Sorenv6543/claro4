name: Apply Tokens Studio changes (PR)

# Manual only — run after a designer pushes token changes from the
# Tokens Studio Figma plugin to this repo's tokens/ directory.
# Opens a PR updating src/styles/tokens.css and src/plugins/vuetify.ts.
# Review the diff before merging; never merges automatically.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Apply token changes to tokens.css and vuetify.ts
        run: node scripts/import-tokens.mjs

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(tokens): apply Tokens Studio changes"
          title: "chore(tokens): apply design token changes from Figma"
          body: |
            Design token sync from Tokens Studio (Figma plugin).

            **What changed:** `src/styles/tokens.css` and `src/plugins/vuetify.ts`
            color/number/string values that differ from the current `tokens/` files.

            **What was NOT touched:** `rgba()` tokens, `var()` aliases, gradients,
            shadows, font stacks, layout dimensions, and calendar tokens — these
            cannot round-trip through Figma and are always preserved as-is.

            Review the diff and confirm the values look intentional before merging.
          branch: chore/figma-token-sync
          delete-branch: true
